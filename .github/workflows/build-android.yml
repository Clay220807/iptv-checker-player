name: Build Android APK (V14 Identifier Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 【关键修复】自动修正非法的 Android 包名
        run: |
          # 使用 Node.js 读取并修改 tauri.conf.json，将非法的横杠包名改为合法的
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.identifier = 'com.iptv.player.app';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
            console.log('✅ 包名已修改为: com.iptv.player.app');
          "

      - name: 8. 初始化 Android (现在包名合法了，直接运行即可)
        run: npm run tauri android init

      - name: 9. 修复权限与配置
        run: |
          # 修复 gradlew 换行符和权限
          if [ -f "src-tauri/gen/android/gradlew" ]; then
            sed -i 's/\r$//' src-tauri/gen/android/gradlew
            chmod +x src-tauri/gen/android/gradlew
            echo "✅ gradlew 权限已修复"
          fi
          
          # 配置 SDK 路径
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties

      - name: 10. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          fi

      - name: 11. 编译 APK
        run: npx tauri android build --debug --target aarch64

      - name: 12. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-android-apk-final
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
