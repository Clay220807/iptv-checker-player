name: Build Android APK (V19 Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境（使用系统原生 SDK，不用第三方插件）
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # 接受所有协议
          yes | sdkmanager --licenses || true
          
          # 安装必要的组件
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          
          # 设置环境变量
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "✅ Android 环境配置完成"

      - name: 7. 修改包名（修复非法横杠）
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.identifier = 'com.iptv.player.app';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
            console.log('✅ 包名已修改为 com.iptv.player.app');
          "

      - name: 8. 初始化 Android 项目
        run: |
          sudo apt-get install -y expect
          expect << 'EOF'
          spawn npm run tauri android init
          expect {
            "Identifier" {
              send "com.iptv.player.app\r"
              exp_continue
            }
            "App Name" {
              send "IPTV Player\r"
              exp_continue
            }
            eof
          }
          EOF
          echo "✅ Android 初始化完成"

      - name: 9. 修复 gradlew 权限和换行符
        run: |
          GRADLEW="src-tauri/gen/android/gradlew"
          if [ -f "$GRADLEW" ]; then
            # 彻底删除 Windows 换行符
            tr -d '\r' < "$GRADLEW" > "${GRADLEW}.tmp" && mv "${GRADLEW}.tmp" "$GRADLEW"
            # 赋予执行权限
            chmod 777 "$GRADLEW"
            echo "✅ gradlew 已修复"
          else
            echo "❌ gradlew 未找到"
            exit 1
          fi
          
          # 配置 SDK 路径
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties
          echo "✅ local.properties 已配置"

      - name: 10. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          fi

      - name: 11. 编译 APK
        run: npx tauri android build --debug --target aarch64

      - name: 12. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v19-final
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
