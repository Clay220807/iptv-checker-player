name: Build Android APK (V22 Last Attempt)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 修复 tauri.conf.json
        run: |
          # 使用 Python 来修复（比 Node 更可靠）
          python3 << 'PYEOF'
          import json
          import re
          
          with open('src-tauri/tauri.conf.json', 'r') as f:
              content = f.read()
          
          # 修复键名和值中的空格
          content = re.sub(r'"(\w+)\s*":\s*"([^"]*)\s*"', r'"\1": "\2"', content)
          
          # 修改 identifier
          content = content.replace('com.zhimin-dev.iptv-checker-player', 'com.iptv.player.app')
          
          with open('src-tauri/tauri.conf.json', 'w') as f:
              f.write(content)
          
          print("✅ 配置文件已修复")
          PYEOF
          
          # 验证修复结果
          echo "=== 修复后的 identifier ==="
          grep -i "identifier" src-tauri/tauri.conf.json || echo "❌ 未找到 identifier"

      - name: 8. 初始化 Android
        run: |
          sudo apt-get install -y expect
          expect << 'EOF'
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "IPTV Player\r"; exp_continue }
            eof
          }
          EOF

      - name: 9. 同步资源
        run: npm run tauri android sync

      - name: 10. 修复 gradlew
        run: |
          GRADLEW="src-tauri/gen/android/gradlew"
          if [ -f "$GRADLEW" ]; then
            sudo apt-get install -y dos2unix
            dos2unix "$GRADLEW"
            chmod +x "$GRADLEW"
            echo "✅ gradlew 已修复"
          else
            echo "❌ gradlew 未找到"
            exit 1
          fi
          
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties

      - name: 11. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          fi

      - name: 12. 编译 APK
        run: |
          cd src-tauri/gen/android
          ./gradlew assembleDebug

      - name: 13. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v22
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
