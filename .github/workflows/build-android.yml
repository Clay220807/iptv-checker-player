name: Build Android APK (V8 Permission Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: 6. 安装前端依赖
        run: npm install

      - name: 7. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: 8. 初始化 Android
        run: echo "com.iptv.player.app" | npm run tauri android init || true

      - name: 9. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/<application/<application\n        android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          fi

      # 【关键修复】：给 gradlew 添加执行权限，解决 BeforeSpawn 错误
      - name: 9.5. 修复 Gradle 执行权限
        run: |
          chmod +x src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar || true
          echo "✅ Gradle 权限已修复"

      - name: 10. 编译 APK
        run: npx tauri android build --debug --target aarch64

      - name: 11. 上传
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v8-success
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
