name: Build Android APK (V11 Deep Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4
        with:
          # 关键：确保 git checkout 时保留文件原本的换行符，防止自动转成 CRLF
          submodules: recursive

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 注意：去掉了 Linux 桌面依赖，安卓编译不需要它们，减少报错点

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: 7. 初始化 Android (直接回车使用默认包名)
        # 关键修复：发送一个空行（回车），让 Tauri 使用 tauri.conf.json 里的默认 identifier
        run: printf "\n" | npm run tauri android init

      - name: 8. 关键修复：处理换行符、权限与 SDK 路径
        run: |
          echo "--- 检查 gen/android 目录 ---"
          ls -la src-tauri/gen/android/ || echo "目录不存在"
          
          # 1. 修复 gradlew 的 Windows 换行符问题 (这是 BeforeSpawn 错误的元凶)
          if [ -f "src-tauri/gen/android/gradlew" ]; then
            sed -i 's/\r$//' src-tauri/gen/android/gradlew
            echo "✅ 已修复 gradlew 换行符"
          fi
          
          # 2. 赋予执行权限
          chmod +x src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar || true
          
          # 3. 确保 local.properties 正确 (告诉 Gradle SDK 在哪)
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties
          echo "✅ local.properties 已配置"

      - name: 9. 允许 HTTP (修改 AndroidManifest)
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # 使用更安全的 sed 替换
            sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          else
            echo "⚠️ 警告：AndroidManifest.xml 未找到"
          fi

      - name: 10. 编译 APK
        # 增加 --verbose 以便如果还失败能看到更详细的日志
        run: npx tauri android build --debug --target aarch64

      - name: 11. 上传
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v11-final
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
