name: Build Android APK (V27 Final Success)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 【关键】修复 tauri.conf.json（清理所有空格）
        run: |
          # 使用 sed 清理所有键名和字符串值的空格
          sed -i 's/"\([^"]*\) "\s*:/ "\1":/g' src-tauri/tauri.conf.json
          sed -i 's/:\s*"\([^"]*\) "/: "\1"/g' src-tauri/tauri.conf.json
          
          # 修改 identifier 为合法的 Android 包名（不能有横杠）
          sed -i 's/com.zhimin-dev.iptv-checker-player/com.iptv.player.app/g' src-tauri/tauri.conf.json
          
          echo "✅ 配置文件已修复"
          echo "=== 修复后的内容 ==="
          cat src-tauri/tauri.conf.json

      - name: 8. 清理旧的 Android 目录
        run: rm -rf src-tauri/gen/android

      - name: 9. 初始化 Android 项目
        run: |
          echo "=== 开始初始化 Android ==="
          # 使用 expect 自动回答交互式问题
          sudo apt-get install -y expect
          
          expect << 'EOF'
          set timeout 300
          spawn npm run tauri android init
          expect {
            "Identifier" { 
              send "com.iptv.player.app\r"
              exp_continue 
            }
            "App Name" { 
              send "iptv-checker-player\r"
              exp_continue 
            }
            eof
          }
          expect eof
          
          echo "=== 初始化完成，检查文件 ==="
          ls -la src-tauri/gen/android/ || echo "❌ 目录未生成"
          test -f src-tauri/gen/android/tauri.settings.gradle && echo "✅ tauri.settings.gradle 存在" || echo "❌ tauri.settings.gradle 缺失"

      - name: 10. 修复 gradlew 权限
        run: |
          sudo apt-get install -y dos2unix
          dos2unix src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew
          
          # 配置 SDK 路径
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties
          echo "✅ 环境配置完成"

      - name: 11. 允许 HTTP 明文传输
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST"
            echo "✅ HTTP 配置已添加"
          else
            echo "❌ AndroidManifest.xml 未找到"
            exit 1
          fi

      - name: 12. 编译 APK
        run: |
          echo "=== 开始编译 Android APK ==="
          cd src-tauri/gen/android
          
          # 再次修复 gradlew（防止被覆盖）
          dos2unix gradlew
          chmod +x gradlew
          
          # 编译
          ./gradlew assembleDebug --no-daemon --stacktrace
          
          echo "=== 编译完成 ==="
          ls -la app/build/outputs/apk/debug/

      - name: 13. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-checker-player-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
