name: Build Android APK (V20 Ultimate Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境（使用系统原生 SDK）
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: 7. 【关键】精准修复 tauri.conf.json (去掉空格，修改包名)
        run: |
          CONF="src-tauri/tauri.conf.json"
          # 1. 修复 identifier 键名 (去掉空格)
          sed -i 's/"identifier "/"identifier"/g' $CONF
          # 2. 修复 identifier 值 (去掉空格，改为合法包名)
          sed -i 's/"com.zhimin-dev.iptv-checker-player "/"com.iptv.player.app"/g' $CONF
          # 3. 修复其他可能带空格的键名 (通用修复)
          sed -i 's/"\([a-zA-Z0-9_]*\) "/"\1"/g' $CONF
          echo "✅ 配置文件已修复"
          cat $CONF | grep identifier

      - name: 8. 初始化 Android (使用 expect)
        run: |
          sudo apt-get install -y expect
          expect << 'EOF'
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "IPTV Player\r"; exp_continue }
            eof
          }
          EOF
          echo "✅ 初始化完成"

      - name: 9. 【关键】修复并锁定 gradlew
        run: |
          GRADLEW="src-tauri/gen/android/gradlew"
          if [ -f "$GRADLEW" ]; then
            # 1. 安装 dos2unix 并彻底转换换行符
            sudo apt-get install -y dos2unix
            dos2unix "$GRADLEW"
            
            # 2. 赋予执行权限
            chmod +x "$GRADLEW"
            
            # 3. 设为只读 (防止 tauri sync 覆盖它)
            chmod 444 "$GRADLEW"
            
            echo "✅ gradlew 已修复并锁定"
            head -n 1 "$GRADLEW"
          else
            echo "❌ gradlew 未找到"
            exit 1
          fi
          
          # 配置 SDK 路径
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties

      - name: 10. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          fi

      - name: 11. 编译 APK
        run: npx tauri android build --debug --target aarch64

      - name: 12. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v20-success
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
