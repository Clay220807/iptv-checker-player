name: Build Android APK (V32 OOM Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 1.5 【关键】增加 Swap 虚拟内存 (防止 Rust 编译 OOM)
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "✅ 已增加 4GB Swap 内存"
          free -h

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 修复 tauri.conf.json
        run: |
          python3 << 'PYEOF'
          import json, re
          with open('src-tauri/tauri.conf.json', 'r') as f: raw = f.read()
          cleaned = re.sub(r'"([^"]*?)\s*"\s*:\s*"([^"]*?)\s*"', r'"\1": "\2"', raw)
          cleaned = re.sub(r'"([^"]*?)\s*"\s*:\s*(true|false|[0-9]+)', r'"\1": \2', cleaned, flags=re.IGNORECASE)
          config = json.loads(cleaned)
          config['identifier'] = 'com.iptv.player.app'
          with open('src-tauri/tauri.conf.json', 'w') as f: json.dump(config, f, indent=2)
          print("✅ 配置已修复")
          PYEOF

      - name: 8. 清理旧目录
        run: rm -rf src-tauri/gen/android

      - name: 9. 初始化 Android
        run: |
          sudo apt-get install -y expect
          expect << 'EOF' || true
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "iptv-checker-player\r"; exp_continue }
            eof
          }
          EOF

      - name: 10. 补全 Gradle 配置 (使用绝对路径引用)
        run: |
          DIR="src-tauri/gen/android"
          mkdir -p $DIR
          
          # 1. 重写 settings.gradle
          cat > $DIR/settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "iptv-checker-player"
          include ':app'
          apply from: 'tauri.settings.gradle'
          EOF

          # 2. 重写 tauri.settings.gradle (使用 settingsDir 确保路径正确)
          cat > $DIR/tauri.settings.gradle << 'EOF'
          include ':tauri-api'
          // 使用 settingsDir 获取当前目录，向上两级找到 node_modules
          def tauriApiDir = new File(settingsDir, '../../node_modules/@tauri-apps/cli/android')
          if (tauriApiDir.exists()) {
              project(':tauri-api').projectDir = tauriApiDir
              println "✅ Found tauri-api at: ${tauriApiDir}"
          } else {
              println "❌ WARNING: tauri-api directory not found at ${tauriApiDir}"
              // 尝试备用路径
              project(':tauri-api').projectDir = new File(settingsDir, '../../node_modules/@tauri-apps/cli/tauri-api/android')
          }
          EOF
          echo "✅ Gradle 配置已补全 (含路径检查)"

      - name: 11. 修复权限与 HTTP
        run: |
          sudo apt-get install -y dos2unix
          dos2unix src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties
          
          # 限制 Gradle 内存，防止 OOM
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> src-tauri/gen/android/gradle.properties
          
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
              sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST"
          fi

      - name: 12. 编译 APK (带内存限制)
        run: |
          echo "=== 开始编译 (已限制内存，防止崩溃) ==="
          cd src-tauri/gen/android
          dos2unix gradlew
          chmod +x gradlew
          # 运行编译
          ./gradlew assembleDebug --no-daemon --stacktrace || echo "编译可能失败，请检查日志"
          
          echo "=== 检查编译结果 ==="
          find . -name "*.apk"

      - name: 13. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v32
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
