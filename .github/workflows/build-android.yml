name: Build Android APK (V10 Perfect)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: 6. 安装前端依赖
        run: npm install

      - name: 7. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: 8. 初始化 Android (使用 yes 命令自动回答)
        # 关键修复：使用 yes 命令不断输入包名，直到 init 完成
        run: yes "com.iptv.player.app" | npm run tauri android init

      - name: 8.5. 关键修复：手动写入 SDK 路径并修复权限
        run: |
          # 1. 确保 gen/android 目录存在
          mkdir -p src-tauri/gen/android
          
          # 2. 手动创建 local.properties，告诉 Gradle SDK 在哪里（解决 BeforeSpawn 错误）
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties
          echo "✅ local.properties 已创建"
          cat src-tauri/gen/android/local.properties
          
          # 3. 修复 gradlew 执行权限
          chmod +x src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar || true
          echo "✅ 权限已修复"

      - name: 9. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/<application/<application\n        android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          else
            echo "⚠️ 警告：AndroidManifest.xml 未找到"
          fi

      - name: 10. 编译 APK
        run: npx tauri android build --debug --target aarch64

      - name: 11. 上传
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v10-success
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
