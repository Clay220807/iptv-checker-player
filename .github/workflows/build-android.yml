name: Build Android APK (V23 Rewritten)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: 7. 【关键】完全重写 tauri.conf.json
        run: |
          cat > src-tauri/tauri.conf.json << 'EOF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "iptv-checker-player",
            "version": "0.1.0",
            "identifier": "com.iptv.player.app",
            "build": {
              "beforeDevCommand": "npm run dev",
              "devUrl": "http://127.0.0.1:5173",
              "beforeBuildCommand": "npm run build",
              "frontendDist": "../dist"
            },
            "app": {
              "windows": [
                {
                  "title": "iptv-checker-player",
                  "label": "main",
                  "width": 1180,
                  "height": 760,
                  "minWidth": 380,
                  "minHeight": 600,
                  "center": true,
                  "resizable": true
                }
              ],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": "all",
              "category": "Entertainment",
              "shortDescription": "IPTV player client",
              "longDescription": "Jellyfin-like IPTV client",
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.icns",
                "icons/icon.ico"
              ]
            }
          }
          EOF
          echo "✅ 配置文件已完全重写"
          cat src-tauri/tauri.conf.json | grep identifier

      - name: 8. 检查 Tauri CLI 版本和可用命令
        run: |
          echo "=== Tauri CLI 版本 ==="
          npm run tauri -- --version || npx tauri --version
          
          echo "=== Android 可用命令 ==="
          npm run tauri android -- --help || npx tauri android --help

      - name: 9. 初始化 Android 项目
        run: |
          sudo apt-get install -y expect
          expect << 'EOF'
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "IPTV Player\r"; exp_continue }
            eof
          }
          EOF
          echo "✅ 初始化完成"
          ls -la src-tauri/gen/android/ || echo "❌ 目录未生成"

      - name: 10. 修复 gradlew 权限
        run: |
          GRADLEW="src-tauri/gen/android/gradlew"
          if [ -f "$GRADLEW" ]; then
            sudo apt-get install -y dos2unix
            dos2unix "$GRADLEW"
            chmod +x "$GRADLEW"
            echo "✅ gradlew 已修复"
          else
            echo "❌ gradlew 未找到"
            exit 1
          fi
          
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties

      - name: 11. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          fi

      - name: 12. 编译 APK (使用 tauri android build)
        run: |
          npx tauri android build --debug --target aarch64
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125

      - name: 13. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v23
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
