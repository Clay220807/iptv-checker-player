name: Build Android APK (V29 Strict Validation)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 【关键】使用 Python 彻底重写 tauri.conf.json
        run: |
          python3 << 'PYEOF'
          import json
          
          # 定义一个完全干净、标准的配置对象
          config = {
              "$schema": "https://schema.tauri.app/config/2",
              "productName": "iptv-checker-player",
              "version": "0.1.0",
              "identifier": "com.iptv.player.app",  # 合法的 Android 包名
              "build": {
                  "beforeDevCommand": "npm run dev",
                  "devUrl": "http://127.0.0.1:5173",
                  "beforeBuildCommand": "npm run build",
                  "frontendDist": "../dist"
              },
              "app": {
                  "windows": [
                      {
                          "title": "iptv-checker-player",
                          "label": "main",
                          "width": 1180,
                          "height": 760,
                          "minWidth": 380,
                          "minHeight": 600,
                          "center": True,
                          "resizable": True
                      }
                  ],
                  "security": {
                      "csp": None
                  }
              },
              "bundle": {
                  "active": True,
                  "targets": "all",
                  "category": "Entertainment",
                  "shortDescription": "IPTV player",
                  "icon": [
                      "icons/32x32.png",
                      "icons/128x128.png",
                      "icons/128x128@2x.png",
                      "icons/icon.icns",
                      "icons/icon.ico"
                  ]
              }
          }
          
          # 写入文件
          with open('src-tauri/tauri.conf.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, indent=2)
          
          print("✅ 配置文件已彻底重写为干净格式")
          PYEOF
          
          echo "=== 验证重写后的文件 ==="
          cat src-tauri/tauri.conf.json

      - name: 8. 清理旧的 Android 目录
        run: rm -rf src-tauri/gen/android

      - name: 9. 初始化 Android 项目
        run: |
          echo "=== 开始初始化 Android ==="
          sudo apt-get install -y expect
          
          # 运行初始化
          expect << 'EOF'
          set timeout 300
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "iptv-checker-player\r"; exp_continue }
            eof
          }
          EOF
          
          echo "=== 初始化结束 ==="

      - name: 10. 【关键验证】检查关键文件是否存在
        run: |
          echo "=== 检查生成的文件 ==="
          ls -la src-tauri/gen/android/
          
          # 检查 tauri.settings.gradle 是否存在
          if [ -f "src-tauri/gen/android/tauri.settings.gradle" ]; then
              echo "✅ tauri.settings.gradle 存在，初始化成功！"
          else
              echo "❌ 致命错误：tauri.settings.gradle 不存在！初始化失败。"
              echo "请检查 Step 7 的配置文件和 Step 9 的初始化日志。"
              exit 1
          fi
          
          # 检查 gradlew 是否存在
          if [ -f "src-tauri/gen/android/gradlew" ]; then
              echo "✅ gradlew 存在"
          else
              echo "❌ gradlew 不存在"
              exit 1
          fi

      - name: 11. 修复 gradlew 权限和配置
        run: |
          sudo apt-get install -y dos2unix
          dos2unix src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew
          
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties
          echo "✅ 环境配置完成"

      - name: 12. 允许 HTTP
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
              sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST"
              echo "✅ HTTP 配置完成"
          fi

      - name: 13. 编译 APK
        run: |
          echo "=== 开始编译 ==="
          cd src-tauri/gen/android
          dos2unix gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo "=== 编译结束 ==="

      - name: 14. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk-v29
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
