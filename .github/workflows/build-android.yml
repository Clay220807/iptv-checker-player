name: Build Android APK (V4 Debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 7. 安装 Android 组件
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: 8. 初始化 Android (关键：使用 echo 传递包名)
        # 这次去掉了 || true，如果这里失败，我们会立刻看到报错
        run: |
          echo "com.iptv.player.app" | npm run tauri android init
          # 检查是否生成成功
          ls -la src-tauri/gen/android/ || echo "Android 目录未生成"

      - name: 9. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/<application/<application\n        android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          fi

      - name: 10. 编译 APK
        run: npx tauri android build --debug --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: 11. 上传
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
