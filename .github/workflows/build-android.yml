name: Build Android APK (V3 Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 编译目标 (关键修复)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android SDK 和 NDK
        uses: android-actions/setup-android@v3
      
      - name: 7. 安装具体的 Android 组件
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: 8. 初始化 Android 项目 (自动输入包名)
        # 使用 yes 命令自动循环输入包名，防止脚本卡住等待
        run: yes "com.iptv.player.app" | npm run tauri android init || true

      - name: 9. 修改配置以允许 HTTP (关键步骤)
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "usesCleartextTraffic" "$MANIFEST_PATH"; then
              sed -i 's/<application/<application\n        android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
              echo "✅ AndroidManifest 修改成功"
            fi
          else
            echo "⚠️ 未找到 AndroidManifest.xml，尝试继续..."
          fi

      - name: 10. 开始编译 APK (Debug 版，针对 arm64 手机)
        run: npx tauri android build --debug --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: 11. 上传成果
        uses: actions/upload-artifact@v4
        with:
          name: iptv-checker-player-android-apk
          # 尝试多个可能的路径，确保能抓到文件
          path: |
            src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
