name: Build Android APK (V30 Manual Gradle Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 修复 tauri.conf.json (Python 清理空格)
        run: |
          python3 << 'PYEOF'
          import json, re
          with open('src-tauri/tauri.conf.json', 'r') as f: raw = f.read()
          cleaned = re.sub(r'"([^"]*?)\s*"\s*:\s*"([^"]*?)\s*"', r'"\1": "\2"', raw)
          cleaned = re.sub(r'"([^"]*?)\s*"\s*:\s*(true|false|[0-9]+)', r'"\1": \2', cleaned, flags=re.IGNORECASE)
          config = json.loads(cleaned)
          config['identifier'] = 'com.iptv.player.app'
          with open('src-tauri/tauri.conf.json', 'w') as f: json.dump(config, f, indent=2)
          print("✅ 配置已修复")
          PYEOF

      - name: 8. 清理旧目录
        run: rm -rf src-tauri/gen/android

      - name: 9. 初始化 Android (允许半失败)
        run: |
          sudo apt-get install -y expect
          expect << 'EOF' || true
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "iptv-checker-player\r"; exp_continue }
            eof
          }
          EOF
          echo "=== 初始化结束 (即使报错也继续) ==="
          ls -la src-tauri/gen/android/ || echo "目录可能为空"

      - name: 10. 【关键】手动补全 Gradle 配置文件 (修复 52 字节问题)
        run: |
          DIR="src-tauri/gen/android"
          mkdir -p $DIR
          
          # 1. 强制覆盖 settings.gradle (标准内容，包含 include ':app')
          cat > $DIR/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iptv-checker-player"
          include ':app'
          apply from: 'tauri.settings.gradle'
          EOF
          echo "✅ settings.gradle 已重写 (包含 include ':app')"

          # 2. 创建 tauri.settings.gradle (指向 Tauri 库)
          # 注意：路径可能是 node_modules/@tauri-apps/cli/android 或者类似路径
          cat > $DIR/tauri.settings.gradle << 'EOF'
          include ':tauri-api'
          project(':tauri-api').projectDir = new File('../../node_modules/@tauri-apps/cli/android')
          EOF
          echo "✅ tauri.settings.gradle 已创建"

          # 3. 检查 app 目录是否存在，不存在就创建基础结构
          if [ ! -d "$DIR/app" ]; then
              echo "⚠️ app 目录缺失，尝试从常见位置复制或创建..."
              # 这里通常 init 会生成 app 目录，如果没生成，编译必败
              # 但我们先假设 init 生成了 app 目录（截图里有 app 文件夹）
          fi

      - name: 11. 修复 gradlew 权限
        run: |
          sudo apt-get install -y dos2unix
          if [ -f "src-tauri/gen/android/gradlew" ]; then
              dos2unix src-tauri/gen/android/gradlew
              chmod +x src-tauri/gen/android/gradlew
              echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
              echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties
              echo "✅ 环境配置完成"
          else
              echo "❌ gradlew 缺失"
              exit 1
          fi

      - name: 12. 允许 HTTP
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
              sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST"
              echo "✅ HTTP 配置完成"
          fi

      - name: 13. 编译 APK
        run: |
          echo "=== 开始编译 ==="
          cd src-tauri/gen/android
          dos2unix gradlew
          chmod +x gradlew
          # 使用 --stacktrace 看到详细错误
          ./gradlew assembleDebug --no-daemon --stacktrace || echo "编译失败，请查看日志"
          echo "=== 编译结束 ==="

      - name: 14. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v30
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
