name: Build Android APK (V12 Diagnostic)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 检查 tauri.conf.json
        run: |
          echo "=== tauri.conf.json 内容 ==="
          cat src-tauri/tauri.conf.json
          echo ""
          echo "=== 检查是否有 Android 配置 ==="
          grep -i "android" src-tauri/tauri.conf.json || echo "❌ 没有找到 Android 配置"

      - name: 8. 尝试初始化 Android (交互式)
        run: |
          echo "=== 开始 tauri android init ==="
          # 使用 expect 工具来自动回答交互式问题
          sudo apt-get install -y expect
          
          expect << 'EOF'
          spawn npm run tauri android init
          expect {
            "Identifier" {
              send "com.iptv.player.app\r"
              exp_continue
            }
            "App Name" {
              send "IPTV Player\r"
              exp_continue
            }
            eof
          }
          EOF
          
          echo "=== 初始化完成，检查生成的文件 ==="
          ls -la src-tauri/gen/android/ || echo "❌ gen/android 目录不存在"
          ls -la src-tauri/gen/android/app/ || echo " app 目录不存在"

      - name: 9. 上传诊断信息
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-info
          path: |
            src-tauri/tauri.conf.json
            src-tauri/gen/android/
