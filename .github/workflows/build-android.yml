name: Build Android APK (V18 Official Action)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        uses: android-actions/setup-android@v3

      - name: 7. 安装 Android SDK 组件
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          yes | sdkmanager --licenses || true

      - name: 8. 修改包名（修复非法横杠）
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.identifier = 'com.iptv.player.app';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          "

      - name: 9. 初始化 Android 项目
        run: |
          # 使用 expect 自动回答
          sudo apt-get install -y expect
          expect -c "
            spawn npm run tauri android init
            expect {
              timeout { exit 1 }
              eof
            }
          "
          # 或者尝试直接运行，看是否会自动使用默认值
          echo "" | npm run tauri android init || true

      - name: 10. 检查生成的文件
        run: |
          echo "=== 检查 gen/android 目录 ==="
          ls -la src-tauri/gen/android/ || echo "❌ 目录不存在"
          echo "=== 检查 gradlew ==="
          ls -la src-tauri/gen/android/gradlew || echo "❌ gradlew 不存在"
          echo "=== 检查 local.properties ==="
          cat src-tauri/gen/android/local.properties || echo " 文件不存在"

      - name: 11. 使用 Tauri 官方 Action 编译
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: android build --debug --target aarch64

      - name: 12. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v18
          path: |
            src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
            src-tauri/target/aarch64-linux-android/debug/*.apk
