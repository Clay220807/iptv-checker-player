name: Build Android APK (V9 Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: 6. 安装前端依赖
        run: npm install

      - name: 7. 配置 Android 环境 (安装 SDK 34 和 NDK 26)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          # 关键：安装 android-34 和 ndk 26，这是 Tauri 2.0 默认需要的
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: 8. 初始化 Android (直接传参，确保成功)
        # 关键修复：直接把包名作为参数，不再用 echo 管道
        run: npm run tauri android init com.iptv.player.app

      - name: 8.5. 检查并修复权限 (调试用)
        run: |
          echo "--- 检查 gen/android 目录 ---"
          ls -la src-tauri/gen/android/
          echo "--- 检查 local.properties ---"
          cat src-tauri/gen/android/local.properties || echo "未找到 local.properties"
          echo "--- 修复权限 ---"
          chmod +x src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar || true

      - name: 9. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/<application/<application\n        android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          else
            echo "⚠️ 警告：AndroidManifest.xml 未找到，初始化可能失败"
          fi

      - name: 10. 编译 APK
        run: npx tauri android build --debug --target aarch64

      - name: 11. 上传
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v9-final-success
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
