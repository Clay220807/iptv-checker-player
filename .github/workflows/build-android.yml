name: Build Android APK (V21 Manual Build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 【关键】修复 tauri.conf.json (去掉空格，修改包名)
        run: |
          node -e "
            const fs = require('fs');
            const file = 'src-tauri/tauri.conf.json';
            let content = fs.readFileSync(file, 'utf8');
            
            // 1. 修复 identifier 的值 (去掉空格，改为合法包名)
            content = content.replace(/\"com\.zhimin-dev\.iptv-checker-player\s*\"/g, '\"com.iptv.player.app\"');
            
            // 2. 修复 identifier 的键名 (去掉空格)
            content = content.replace(/\"identifier\s*\"/g, '\"identifier\"');
            
            // 3. 修复其他带空格的键名 (通用修复，如 \"productName \")
            content = content.replace(/\"([a-zA-Z0-9_]+)\s*\"/g, '\"$1\"');
            
            // 4. 修复值末尾的空格 (针对普通字符串值)
            content = content.replace(/:\s*\"([^\"]*?)\s*\"/g, ': \"$1\"');
            
            fs.writeFileSync(file, content);
            console.log('✅ 配置文件已修复');
          "
          cat src-tauri/tauri.conf.json | grep identifier

      - name: 8. 初始化 Android 项目
        run: |
          sudo apt-get install -y expect
          expect << 'EOF'
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "IPTV Player\r"; exp_continue }
            eof
          }
          EOF

      - name: 9. 同步 Android 资源 (生成完整的 gradle 项目)
        run: npm run tauri android sync

      - name: 10. 【关键】手动修复 gradlew 并赋予权限
        run: |
          GRADLEW="src-tauri/gen/android/gradlew"
          if [ -f "$GRADLEW" ]; then
            # 1. 安装 dos2unix 并转换换行符
            sudo apt-get install -y dos2unix
            dos2unix "$GRADLEW"
            
            # 2. 赋予执行权限 (不要锁定，因为后面要运行它)
            chmod +x "$GRADLEW"
            echo "✅ gradlew 已修复并赋予权限"
          else
            echo "❌ gradlew 未找到"
            exit 1
          fi
          
          # 配置 SDK 路径
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties

      - name: 11. 允许 HTTP
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST_PATH"
            echo "✅ HTTP 配置完成"
          fi

      - name: 12. 【关键】手动编译 APK (绕过 tauri build)
        run: |
          cd src-tauri/gen/android
          # 直接调用 gradlew 编译 debug 版
          ./gradlew assembleDebug
          echo "✅ 编译完成"

      - name: 13. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v21-success
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
