name: Build Android APK (V34 Strict Mode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 1.5 增加 Swap 内存
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=4096
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          free -h

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 修复 tauri.conf.json
        run: |
          python3 << 'PYEOF'
          import json, re
          with open('src-tauri/tauri.conf.json', 'r') as f: raw = f.read()
          cleaned = re.sub(r'"([^"]*?)\s*"\s*:\s*"([^"]*?)\s*"', r'"\1": "\2"', raw)
          cleaned = re.sub(r'"([^"]*?)\s*"\s*:\s*(true|false|[0-9]+)', r'"\1": \2', cleaned, flags=re.IGNORECASE)
          config = json.loads(cleaned)
          config['identifier'] = 'com.iptv.player.app'
          with open('src-tauri/tauri.conf.json', 'w') as f: json.dump(config, f, indent=2)
          PYEOF

      - name: 8. 清理旧目录
        run: rm -rf src-tauri/gen/android

      - name: 9. 初始化 Android
        run: |
          sudo apt-get install -y expect
          expect << 'EOF' || true
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "iptv-checker-player\r"; exp_continue }
            eof
          }
          EOF

      - name: 10. 补全 Gradle 配置
        run: |
          DIR="src-tauri/gen/android"
          mkdir -p $DIR
          cat > $DIR/settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "iptv-checker-player"
          include ':app'
          apply from: 'tauri.settings.gradle'
          EOF
          cat > $DIR/tauri.settings.gradle << 'EOF'
          include ':tauri-api'
          def dir = new File(settingsDir, '../../node_modules/@tauri-apps/cli/android')
          project(':tauri-api').projectDir = dir.exists() ? dir : new File(settingsDir, '../../node_modules/@tauri-apps/cli/tauri-api/android')
          EOF

      - name: 11. 修复权限与 HTTP
        run: |
          sudo apt-get install -y dos2unix
          dos2unix src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> src-tauri/gen/android/gradle.properties
          
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          [ -f "$MANIFEST" ] && sed -i '/<application/a\        android:usesCleartextTraffic="true"' "$MANIFEST"

      - name: 12. 【关键】编译 APK (严格模式，失败即报错)
        run: |
          echo "=== 开始编译 (如果失败请直接看这里的红色报错) ==="
          cd src-tauri/gen/android
          dos2unix gradlew
          chmod +x gradlew
          # 注意：这里去掉了 || echo，如果编译失败，任务会直接变红停止
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 13. 查找并上传
        run: |
          echo "=== 查找 APK ==="
          APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
             echo "❌ 没找到 APK！"
             exit 1
          fi
          echo "✅ 找到 APK: $APK"
          mkdir -p final_output
          cp "$APK" final_output/iptv-player.apk

      - name: 14. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-final
          path: final_output/iptv-player.apk
