name: Build Android APK (V26 Clean Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 【关键】暴力覆盖 tauri.conf.json（完全干净的内容）
        run: |
          echo '{
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "iptv-checker-player",
            "version": "0.1.0",
            "identifier": "com.iptv.player.app",
            "build": {
              "beforeDevCommand": "npm run dev",
              "devUrl": "http://127.0.0.1:5173",
              "beforeBuildCommand": "npm run build",
              "frontendDist": "../dist"
            },
            "app": {
              "windows": [
                {
                  "title": "iptv-checker-player",
                  "label": "main",
                  "width": 1180,
                  "height": 760,
                  "minWidth": 380,
                  "minHeight": 600,
                  "center": true,
                  "resizable": true
                }
              ],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": "all",
              "category": "Entertainment",
              "shortDescription": "IPTV player",
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.icns",
                "icons/icon.ico"
              ]
            }
          }' > src-tauri/tauri.conf.json
          
          echo "✅ 配置文件已完全覆盖"
          cat src-tauri/tauri.conf.json

      - name: 8. 清理旧的 Android 目录
        run: rm -rf src-tauri/gen/android

      - name: 9. 初始化 Android（关键步骤）
        run: |
          echo "=== 开始初始化 Android ==="
          # 使用 printf 模拟回车，避免交互式等待
          printf "\n\n" | npm run tauri android init
          
          echo "=== 检查生成的文件 ==="
          ls -la src-tauri/gen/android/
          ls -la src-tauri/gen/android/tauri.settings.gradle || echo "❌ tauri.settings.gradle 不存在！"

      - name: 10. 修复 gradlew 和配置
        run: |
          sudo apt-get install -y dos2unix
          dos2unix src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew
          
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties

      - name: 11. 允许 HTTP
        run: |
          sed -i '/<application/a\        android:usesCleartextTraffic="true"' \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: 12. 编译 APK
        run: |
          cd src-tauri/gen/android
          ./gradlew assembleDebug --no-daemon

      - name: 13. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v26
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
