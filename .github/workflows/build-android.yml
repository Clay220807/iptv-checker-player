name: Build Android APK (V25 Python + Direct Gradle)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 获取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Rust 及 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 4. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. 安装前端依赖
        run: npm install

      - name: 6. 配置 Android 环境
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 7. 使用 Python 生成干净的 tauri.conf.json
        run: |
          python3 << 'PYEOF'
          import json
          
          config = {
              "$schema": "https://schema.tauri.app/config/2",
              "productName": "iptv-checker-player",
              "version": "0.1.0",
              "identifier": "com.iptv.player.app",
              "build": {
                  "beforeDevCommand": "npm run dev",
                  "devUrl": "http://127.0.0.1:5173",
                  "beforeBuildCommand": "npm run build",
                  "frontendDist": "../dist"
              },
              "app": {
                  "windows": [
                      {
                          "title": "iptv-checker-player",
                          "label": "main",
                          "width": 1180,
                          "height": 760,
                          "minWidth": 380,
                          "minHeight": 600,
                          "center": True,
                          "resizable": True
                      }
                  ],
                  "security": {
                      "csp": None
                  }
              },
              "bundle": {
                  "active": True,
                  "targets": "all",
                  "category": "Entertainment",
                  "shortDescription": "IPTV player client",
                  "longDescription": "Jellyfin-like IPTV client",
                  "icon": [
                      "icons/32x32.png",
                      "icons/128x128.png",
                      "icons/128x128@2x.png",
                      "icons/icon.icns",
                      "icons/icon.ico"
                  ]
              }
          }
          
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(config, f, indent=2)
          
          print("✅ Python 已生成干净的 tauri.conf.json")
          PYEOF
          
          echo "=== 验证 identifier ==="
          grep identifier src-tauri/tauri.conf.json

      - name: 8. 清理旧的 Android 目录
        run: rm -rf src-tauri/gen/android

      - name: 9. 初始化 Android
        run: |
          sudo apt-get install -y expect
          expect << 'EOF'
          spawn npm run tauri android init
          expect {
            "Identifier" { send "com.iptv.player.app\r"; exp_continue }
            "App Name" { send "IPTV Player\r"; exp_continue }
            eof
          }
          EOF
          echo "✅ 初始化完成"

      - name: 10. 第一次修复 gradlew
        run: |
          sudo apt-get install -y dos2unix
          dos2unix src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew
          echo "sdk.dir=/usr/local/lib/android/sdk" > src-tauri/gen/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> src-tauri/gen/android/local.properties

      - name: 11. 允许 HTTP
        run: |
          sed -i '/<application/a\        android:usesCleartextTraffic="true"' \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: 12. 【关键】直接调用 gradlew 编译（绕过 tauri build）
        run: |
          echo "=== 第二次修复 gradlew（编译前）==="
          dos2unix src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew
          
          echo "=== 开始编译 ==="
          cd src-tauri/gen/android
          ./gradlew assembleDebug --no-daemon
          
          echo "=== 编译完成，检查 APK ==="
          ls -la app/build/outputs/apk/debug/ || echo "❌ APK 未生成"

      - name: 13. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk-v25-success
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
